<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NoobNinja</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;max-width:880px;margin:40px auto;padding:0 20px;color:#222}
    header{display:flex;align-items:center;gap:16px}
    h1{margin:0}
    .cta{margin-top:24px}
    footer{margin-top:40px;border-top:1px solid #eee;padding-top:16px;color:#666;font-size:13px}
  </style>
</head>
<body>
  <header>
    <img src=".github/logo-light.svg" alt="NoobNinja" width="72" height="72">
    <div>
      <h1>NoobNinja</h1>
      <p>模型小白解碼器 — 基於 Netron 的模型檢視與說明工具。</p>
    </div>
  </header>

  <section class="cta">
    <p><strong>原始碼：</strong> <a href="https://github.com/andycyw/NoobNinja">github.com/andycyw/NoobNinja</a></p>
    <p><strong>下載/ Releases：</strong> <a href="https://github.com/andycyw/NoobNinja/releases">Releases</a></p>
  </section>

  <section>
    <h2>快速開始</h2>
    <ol>
      <li>在瀏覽器中直接開啟本專案的 <code>source/index.html</code> 以使用網頁版界面。</li>
      <li>或依說明建置 Electron 應用：檢查 <code>package.json</code> 的 <code>build</code> 設定，執行 <code>node package.js build</code>。</li>
    </ol>
  </section>

  <footer>
    <div>Copyright © 2025 AndyCy Wu</div>
  </footer>
</body>
</html>
